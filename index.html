<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Military PFA & HAMR Pacer</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between font-sans">

    <!-- Header & Branch Selector -->
    <header class="bg-slate-800 border-b border-yellow-600 p-4 space-y-4">
        <div class="text-center">
            <h1 class="text-xl font-black tracking-widest text-yellow-500 uppercase">⚡ MILITARY PFA & HAMR PACER</h1>
            <p class="text-xs text-slate-400 font-semibold tracking-wider">OFFICIAL RECRUIT & ACTIVE DUTY STANDARDS</p>
        </div>

        <!-- Mode Toggle Selector -->
        <div class="flex bg-slate-950 p-1 rounded-lg max-w-md mx-auto border border-slate-700">
            <button onclick="setMode('run')" id="mode-run" class="w-1/2 py-2 text-xs font-bold rounded-md bg-yellow-500 text-slate-950 transition-all">
                🏃‍♂️ DISTANCE RUN
            </button>
            <button onclick="setMode('hamr')" id="mode-hamr" class="w-1/2 py-2 text-xs font-bold rounded-md text-slate-400 hover:text-slate-200 transition-all">
                🔔 HAMR BEEP TEST
            </button>
        </div>

        <!-- Demographics Selectors -->
        <div id="demographics-panel" class="grid grid-cols-3 gap-2 max-w-md mx-auto">
            <!-- Branch Selector -->
            <select id="select-branch" onchange="updateStandards()" class="bg-slate-700 border border-slate-600 text-white rounded p-2 text-xs font-bold">
                <option value="airforce">Air Force</option>
                <option value="navy">Navy</option>
                <option value="army">Army</option>
            </select>
            <!-- Gender Selector -->
            <select id="select-gender" onchange="updateStandards()" class="bg-slate-700 border border-slate-600 text-white rounded p-2 text-xs font-bold">
                <option value="male">Male</option>
                <option value="female">Female</option>
            </select>
            <!-- Age Selector -->
            <select id="select-age" onchange="updateStandards()" class="bg-slate-700 border border-slate-600 text-white rounded p-2 text-xs font-bold">
                <option value="under25">&lt; 25 Yrs</option>
                <option value="25to29">25 - 29 Yrs</option>
                <option value="30to34">30 - 34 Yrs</option>
                <option value="35to39">35 - 39 Yrs</option>
                <option value="40to44">40 - 44 Yrs</option>
                <option value="45to49">45 - 49 Yrs</option>
                <option value="50to54">50 - 54 Yrs</option>
                <option value="55to59">55 - 59 Yrs</option>
                <option value="60plus">60+ Yrs</option>
            </select>
        </div>
    </header>

    <!-- Main Dashboard -->
    <main class="flex-grow flex flex-col justify-center items-center px-6 py-4 space-y-6">
        
        <!-- Live Standards Display -->
        <div class="text-center space-y-1">
            <span id="target-label" class="text-xs font-bold text-yellow-500 uppercase tracking-widest block">AIR FORCE FITNESS ASSESSMENT</span>
            <span id="target-rule" class="text-sm text-slate-300">Goal: 2.0 Miles in under 19:45</span>
        </div>

        <!-- Large Metrics Readout -->
        <div class="w-full max-w-sm bg-slate-800 rounded-2xl p-6 border border-slate-700 shadow-xl space-y-6">
            
            <!-- Dynamic Distance / Level Display -->
            <div class="text-center">
                <span class="text-6xl font-extrabold text-white transition-all duration-200" id="primary-metric">0.00</span>
                <span class="text-lg font-bold text-slate-400 uppercase tracking-wider block mt-1" id="primary-metric-label">MILES</span>
            </div>

            <hr class="border-slate-700">

            <!-- Split Stats Grid -->
            <div class="grid grid-cols-2 gap-4 text-center">
                <div class="border-r border-slate-700">
                    <span class="text-2xl font-bold text-white block" id="secondary-left">00:00</span>
                    <span class="text-xs text-slate-400 uppercase tracking-wider" id="secondary-left-label">Time Elapsed</span>
                </div>
                <div>
                    <span class="text-2xl font-bold text-white block" id="secondary-right">--:--</span>
                    <span class="text-xs text-slate-400 uppercase tracking-wider" id="secondary-right-label">Current Pace</span>
                </div>
            </div>

            <!-- Target Status Banner -->
            <div id="status-banner" class="bg-slate-700 text-yellow-500 text-center py-2 px-4 rounded-lg font-bold text-sm uppercase tracking-wide transition-all duration-300">
                Awaiting GPS Signal...
            </div>
        </div>

        <!-- Stride Metronome Controls (Precise Hardware Clock Engine) -->
        <div id="metronome-panel" class="w-full max-w-sm bg-slate-800 rounded-xl p-4 border border-slate-700 space-y-3">
            <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider text-center">⏱️ Cadence / Stride Metronome</h3>
            <div class="flex items-center justify-between space-x-4">
                <button id="metro-btn" onclick="toggleMetronome()" class="w-1/2 bg-slate-700 hover:bg-slate-600 text-white font-bold text-xs py-2 px-3 rounded transition shadow">
                    🔇 Metronome OFF
                </button>
                <div class="w-1/2 text-center">
                    <span id="metro-spm-val" class="text-sm font-black text-yellow-500 block">170 SPM</span>
                    <input type="range" min="140" max="210" step="5" value="170" oninput="updateMetronomeSpm(this.value)" class="w-full accent-yellow-500 h-1 bg-slate-700 rounded-lg appearance-none cursor-pointer">
                </div>
            </div>
        </div>

        <!-- Simulator Helper Controls (Disabled in HAMR Mode) -->
        <div id="simulator-panel" class="w-full max-w-sm bg-slate-800/50 rounded-xl p-4 border border-slate-700/50 space-y-3">
            <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider text-center">🧪 Run Simulation Controls</h3>
            <div class="grid grid-cols-2 gap-2">
                <button onclick="simulateRunStep(0.1, 55)" class="bg-slate-700 hover:bg-slate-600 text-white text-xs py-2 px-3 rounded font-semibold transition">
                    Simulate Slow Pace
                </button>
                <button onclick="simulateRunStep(0.1, 38)" class="bg-slate-700 hover:bg-slate-600 text-white text-xs py-2 px-3 rounded font-semibold transition">
                    Simulate Pass Pace
                </button>
            </div>
        </div>

    </main>

    <!-- Navigation / Action Bar -->
    <footer class="bg-slate-800 p-6 border-t border-slate-700 flex justify-center">
        <button id="action-btn" onclick="toggleActivity()" class="w-full max-w-sm bg-yellow-500 hover:bg-yellow-400 text-slate-950 font-black text-lg py-4 rounded-xl shadow-lg uppercase tracking-widest transition-all transform active:scale-95">
            🏁 Start Training Run
        </button>
    </footer>

    <!-- Core App Logic -->
    <script>
        // Database of physical test standards
        const StandardsDatabase = {
            airforce: {
                name: "Air Force Fitness Assessment",
                distance: 2.0, // Updated 2-mile standard
                rules: {
                    male: {
                        under25: 1185, "25to29": 1195, "30to34": 1244, "35to39": 1276, "40to44": 1324, "45to49": 1347, "50to54": 1370, "55to59": 1416, "60plus": 1440
                    },
                    female: {
                        under25: 1523, "25to29": 1540, "30to34": 1575, "35to39": 1590, "40to44": 1612, "45to49": 1635, "50to54": 1685, "55to59": 1720, "60plus": 1780
                    }
                }
            },
            navy: {
                name: "Navy Physical Readiness Test",
                distance: 1.5,
                rules: {
                    male: {
                        under25: 810, "25to29": 840, "30to34": 900, "35to39": 900, "40to44": 960, "45to49": 960, "50to54": 1020, "55to59": 1020, "60plus": 1020
                    },
                    female: {
                        under25: 930, "25to29": 990, "30to34": 1020, "35to39": 1020, "40to44": 1080, "45to49": 1080, "50to54": 1140, "55to59": 1140, "60plus": 1140
                    }
                }
            },
            army: {
                name: "Army Combat Fitness Test (ACFT)",
                distance: 2.0,
                rules: {
                    male: {
                        under25: 1320, "25to29": 1320, "30to34": 1380, "35to39": 1380, "40to44": 1440, "45to49": 1440, "50to54": 1500, "55to59": 1500, "60plus": 1500
                    },
                    female: {
                        under25: 1440, "25to29": 1440, "30to34": 1500, "35to39": 1500, "40to44": 1560, "45to49": 1560, "50to54": 1620, "55to59": 1620, "60plus": 1620
                    }
                }
            }
        };

        // Mathematically exact 20m HAMR shuttle test levels and timings (Levels 1 - 21)
        const HAMR_LEVELS = [
            { level: 1,  shuttles: 7,  interval: 8.98 }, 
            { level: 2,  shuttles: 8,  interval: 8.01 }, 
            { level: 3,  shuttles: 8,  interval: 7.56 }, 
            { level: 4,  shuttles: 9,  interval: 7.17 }, 
            { level: 5,  shuttles: 9,  interval: 6.83 }, 
            { level: 6,  shuttles: 10, interval: 6.51 }, 
            { level: 7,  shuttles: 10, interval: 6.22 }, 
            { level: 8,  shuttles: 10, interval: 5.97 }, 
            { level: 9,  shuttles: 11, interval: 5.72 }, 
            { level: 10, shuttles: 11, interval: 5.50 }, 
            { level: 11, shuttles: 12, interval: 5.29 }, 
            { level: 12, shuttles: 12, interval: 5.12 }, 
            { level: 13, shuttles: 13, interval: 4.93 }, 
            { level: 14, shuttles: 13, interval: 4.76 }, 
            { level: 15, shuttles: 13, interval: 4.60 }, 
            { level: 16, shuttles: 14, interval: 4.46 }, 
            { level: 17, shuttles: 14, interval: 4.32 }, 
            { level: 18, shuttles: 15, interval: 4.19 }, 
            { level: 19, shuttles: 15, interval: 4.07 }, 
            { level: 20, shuttles: 16, interval: 3.97 }, 
            { level: 21, shuttles: 16, interval: 3.85 }  
        ];

        // System Variables
        let currentMode = "run"; 
        let isRunning = false;
        let elapsedSeconds = 0;
        let totalDistanceMiles = 0.00;
        let watchId = null;
        let timerId = null;
        let lastCueTime = 0;
        let halfwayCueTriggered = false;

        // HAMR state parameters
        let currentLevelIndex = 0;
        let currentShuttleIndex = 0;
        let secondsInShuttle = 0.00;

        // Metronome State & Hardware Scheduling parameters (Anti-drift Engine)
        let isMetronomeOn = false;
        let metronomeSpm = 170;
        let schedulerTimerId = null;
        let nextNoteTime = 0.0;     
        const scheduleAheadTime = 0.1; 
        const lookaheadInterval = 25.0; 

        // UI Target Settings
        let targetDistance = 2.0;
        let targetMaxTimeSeconds = 1185; 
        let targetPaceSeconds = 592; 

        // HTML elements pointers
        const primaryMetric = document.getElementById('primary-metric');
        const primaryMetricLabel = document.getElementById('primary-metric-label');
        const secondaryLeft = document.getElementById('secondary-left');
        const secondaryLeftLabel = document.getElementById('secondary-left-label');
        const secondaryRight = document.getElementById('secondary-right');
        const secondaryRightLabel = document.getElementById('secondary-right-label');
        const statusBanner = document.getElementById('status-banner');
        const actionBtn = document.getElementById('action-btn');
        const targetLabel = document.getElementById('target-label');
        const targetRule = document.getElementById('target-rule');
        const selectBranch = document.getElementById('select-branch');
        const selectGender = document.getElementById('select-gender');
        const selectAge = document.getElementById('select-age');
        const simulatorPanel = document.getElementById('simulator-panel');
        const metronomePanel = document.getElementById('metronome-panel');

        const synth = window.speechSynthesis;

        function speak(text) {
            if (synth.speaking) synth.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            synth.speak(utterance);
        }

        // Native Sound Generator utilizing the High-Precision Web Audio Hardware clock
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playBeep(frequency = 800, duration = 0.15, startTime = 0) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            osc.frequency.setValueAtTime(frequency, startTime || audioCtx.currentTime);
            gain.gain.setValueAtTime(0.2, startTime || audioCtx.currentTime);
            
            gain.gain.exponentialRampToValueAtTime(0.001, (startTime || audioCtx.currentTime) + duration);
            
            osc.start(startTime || audioCtx.currentTime);
            osc.stop((startTime || audioCtx.currentTime) + duration + 0.01);
        }

        // Metronome Precise Lookahead Scheduling Engine
        function scheduler() {
            while (nextNoteTime < audioCtx.currentTime + scheduleAheadTime) {
                playBeep(1200, 0.02, nextNoteTime);
                advanceNote();
            }
        }

        function advanceNote() {
            const secondsPerBeat = 60.0 / metronomeSpm;
            nextNoteTime += secondsPerBeat;
        }

        function toggleMetronome() {
            isMetronomeOn = !isMetronomeOn;
            const btn = document.getElementById('metro-btn');
            if (isMetronomeOn) {
                btn.innerHTML = "🔊 Metronome ON";
                btn.classList.replace("bg-slate-700", "bg-green-600");
                if (isRunning && currentMode === "run") {
                    startMetronomeTimer();
                }
            } else {
                btn.innerHTML = "🔇 Metronome OFF";
                btn.classList.replace("bg-green-600", "bg-slate-700");
                stopMetronomeTimer();
            }
        }

        function startMetronomeTimer() {
            stopMetronomeTimer();
            if (!isMetronomeOn) return;
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            nextNoteTime = audioCtx.currentTime + 0.05;
            schedulerTimerId = setInterval(scheduler, lookaheadInterval);
        }

        function stopMetronomeTimer() {
            if (schedulerTimerId) {
                clearInterval(schedulerTimerId);
                schedulerTimerId = null;
            }
        }

        function updateMetronomeSpm(val) {
            metronomeSpm = parseInt(val);
            document.getElementById('metro-spm-val').innerText = val + " SPM";
            if (isMetronomeOn && isRunning && currentMode === "run") {
                startMetronomeTimer();
            }
        }

        function setMode(mode) {
            if (isRunning) {
                alert("Please stop current activity before changing modes.");
                return;
            }
            currentMode = mode;
            
            const runBtn = document.getElementById('mode-run');
            const hamrBtn = document.getElementById('mode-hamr');

            if (mode === "run") {
                runBtn.className = "w-1/2 py-2 text-xs font-bold rounded-md bg-yellow-500 text-slate-950 transition-all";
                hamrBtn.className = "w-1/2 py-2 text-xs font-bold rounded-md text-slate-400 hover:text-slate-200 transition-all";
                simulatorPanel.classList.remove('hidden');
                metronomePanel.classList.remove('hidden');
                actionBtn.innerText = "🏁 Start Training Run";
            } else {
                hamrBtn.className = "w-1/2 py-2 text-xs font-bold rounded-md bg-yellow-500 text-slate-950 transition-all";
                runBtn.className = "w-1/2 py-2 text-xs font-bold rounded-md text-slate-400 hover:text-slate-200 transition-all";
                simulatorPanel.classList.add('hidden');
                metronomePanel.classList.add('hidden');
                actionBtn.innerText = "🏁 Start HAMR Test";
                if (isMetronomeOn) toggleMetronome(); 
            }

            resetUI();
            updateStandards();
        }

        function updateStandards() {
            const branch = selectBranch.value;
            const gender = selectGender.value;
            const ageGroup = selectAge.value;

            if (currentMode === "run") {
                const config = StandardsDatabase[branch];
                targetDistance = config.distance;
                targetMaxTimeSeconds = config.rules[gender][ageGroup];
                targetPaceSeconds = targetMaxTimeSeconds / targetDistance;

                targetLabel.innerHTML = `${config.name.toUpperCase()} RUN`;
                targetRule.innerHTML = `Goal: ${targetDistance.toFixed(1)} Miles in under ${formatTime(targetMaxTimeSeconds)} (${formatTime(Math.round(targetPaceSeconds))} Pace)`;
            } else {
                targetLabel.innerHTML = "USAF 20M SHUTTLE RUN (HAMR)";
                targetRule.innerHTML = "Objective: Run 20m shuttle back and forth on the signal tone.";
            }
        }

        function toggleActivity() {
            if (!isRunning) {
                currentMode === "run" ? startRun() : startHamr();
            } else {
                stopActivity();
            }
        }

        function startRun() {
            isRunning = true;
            elapsedSeconds = 0;
            totalDistanceMiles = 0.00;
            lastCueTime = 0;
            halfwayCueTriggered = false;
            resetUI();

            actionBtn.innerHTML = "⏹️ Stop Run";
            actionBtn.className = "w-full max-w-sm bg-red-600 hover:bg-red-500 text-white font-black text-lg py-4 rounded-xl shadow-lg uppercase tracking-widest transition-all";

            speak(`Starting run. Distance goal is ${targetDistance} miles.`);

            if (isMetronomeOn) {
                startMetronomeTimer();
            }

            timerId = setInterval(() => {
                elapsedSeconds++;
                updateTimerUI();
                processRunPacing();
            }, 1000);

            if ("geolocation" in navigator) {
                statusBanner.innerHTML = "GPS Tracking Engaged";
                statusBanner.className = "bg-green-900/40 text-green-400 text-center py-2 px-4 rounded-lg font-bold text-sm uppercase tracking-wide";
                
                watchId = navigator.geolocation.watc
